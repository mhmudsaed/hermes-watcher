[project]
name = "hermes-watcher"
version = "0.1.0"
description = "Daily job-feed watcher: polls public job boards, dedupes in SQLite, delivers one Telegram digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1,<1",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
watcher = "watcher.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
